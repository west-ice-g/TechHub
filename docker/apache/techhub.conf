ServerName localhost

<Directory /var/www/html/public>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<Directory /var/www/html/public/uploads>
    Options -Indexes -ExecCGI

    <FilesMatch "\.(php|php3|php4|php5|php7|php8|phtml|phar|pl|py|jsp|asp|aspx|sh|cgi)$">
        Require all denied
    </FilesMatch>
</Directory>
